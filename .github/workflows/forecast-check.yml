# Optional safety net for hosts that sleep when idle (for example Render's free plan).
# Calls the backend every 15 minutes: that wakes it up and runs a forecast check + alert pass.
# Duplicate pushes are impossible: the server uses a database lock and per-day de-duplication.
# Setup: repo Settings > Secrets and variables > Actions, add API_URL (https://your-api.onrender.com) and ADMIN_API_KEY.
name: forecast-check
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run forecast check
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/admin/run-check" -H "x-admin-key: $ADMIN_API_KEY"
